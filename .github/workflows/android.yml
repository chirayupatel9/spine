name: android

# Every change to the Android app that reaches main is built, signed with the upload key and
# released to Google Play's internal testing track, where testers' phones update on their own.
# "Run workflow" on the Actions tab releases by hand. Until the upload key is in the repository's
# secrets, it only checks that the app builds (README, "Android app").
#
#   ANDROID_KEYSTORE_BASE64     the upload key (android/upload.keystore), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD   its password
#
# Google Play takes the release from the play-publisher service account. GitHub signs in as it
# without any stored Google key (workload identity federation): Google trusts this repository's
# GitHub sign-in tokens, and nothing else.

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # GitHub's sign-in token for Google

concurrency:
  group: android-release   # one release at a time, in order
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CAN_SIGN: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
      GOOGLE_PROVIDER: projects/38245494826/locations/global/workloadIdentityPools/github/providers/spine
      PLAY_SERVICE_ACCOUNT: play-publisher@album-viewer-515917.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the version code is the number of commits

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        run: |
          echo "VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "Version code $(git rev-list --count HEAD)"

      - name: Upload key
        if: env.CAN_SIGN == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"

      - name: Build the bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace
          ls -l app/build/outputs/bundle/release/

      - name: Check the signature
        if: env.CAN_SIGN == 'true'
        run: |
          out=$(jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab)
          echo "$out" | head -1
          echo "$out" | grep -q "^jar verified"

      - name: Sign in to Google Play
        id: google
        if: env.CAN_SIGN == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GOOGLE_PROVIDER }}
          service_account: ${{ env.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - uses: actions/setup-python@v5
        if: env.CAN_SIGN == 'true'
        with:
          python-version: "3.12"

      - name: Release to internal testing
        if: env.CAN_SIGN == 'true'
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: |
          pip install --quiet requests
          python android/publish.py android/app/build/outputs/bundle/release/app-release.aab \
            --track internal --name "$VERSION_CODE · $(git log -1 --format=%s)"

      - name: Say what was skipped
        if: env.CAN_SIGN != 'true'
        run: echo "::notice::Built only. Put the upload key in the repository's secrets to sign and release (README, 'Android app')."

      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"
