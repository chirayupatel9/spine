services:
  album-viewer:
    build: .
    container_name: album-viewer
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"     # must be able to write ./data
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ${MUSIC_PATH:-./music}:/music:ro   # your music folder (read-only)
      - ./data:/data                       # database, cached artwork, generated password
